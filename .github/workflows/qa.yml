# ============================================================================
# QA: autofix (pull requests from this repository) then the read-only gate
# ============================================================================
# Two jobs, chained with `needs:`:
#
#   autofix (same-repository PR only, writes and commits back)  ──needs──►  gate (read-only QA)
#
# 1. autofix runs only on a pull request whose head branch lives in this repository. It checks out the
#    branch tip, runs the fixers in write mode (QA_READONLY=0: Rector and PHP CS Fixer rewrite), and if
#    anything changed commits and pushes the fix back to the branch. A fork pull request cannot be pushed
#    to with this repository's token, so autofix is skipped for it and the gate checks the PR as submitted.
#
# 2. gate checks out the same (possibly auto-fixed) tip and runs the full `vendor/bin/qa` pipeline (coding
#    standards, linting, the changelog lane, static analysis, tests with coverage, mutation testing), the
#    measurement floors (scripts/check-qa-measurements.bash) and the upstream shell conformance suites.
#    php-qa-ci turns on read-only mode on GitHub Actions, so Rector and CS Fixer run as --dry-run and fail
#    on any change.
#
# A push made with GITHUB_TOKEN starts no workflow run, so when autofix pushes a fix the new head commit
# would never get its own gate check and branch protection would wait for it for ever. autofix therefore
# dispatches this workflow on the branch after pushing (workflow_dispatch is the event GITHUB_TOKEN may
# start), which reports the gate check on the new head commit.
#
# Triggers: every push, but the gate runs for a push only on the default branch (a feature branch is covered
# by its pull request), so nothing runs twice and no branch name is hard-coded.
#
# Required GitHub configuration: Settings > Actions > General > Workflow permissions "Read and write", and
# the default branch protected with the "QA gate (read-only qa)" check required.
#
# Every action is pinned to a commit SHA (the tag it was taken from is in the trailing comment), and no
# checkout leaves the token in .git/config, so the PR code that composer and the fixers run cannot read it.
# ============================================================================

name: QA

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch (normalised across push & PR events).
concurrency:
  group: qa-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# php-qa-ci's composer plugins (skills/agents/hooks deploy + managed source) write
# into the working tree on every install. In CI that write-back is unwanted and the
# read-only gate would FAIL on the resulting drift — disable it globally.
env:
  PHP_QA_CI_DISABLE_CONFIG_PUSH: 'true'

jobs:
  autofix:
    name: Auto-fix (apply fixers, commit back) [inline barrier]
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout the PR branch tip
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
          extensions: mbstring, intl, json, zip, dom, curl, libxml, xml, simplexml, iconv, pdo

      # --no-scripts skips post-install scripts; the php-qa-ci composer plugin still runs (a plugin event),
      # which is why PHP_QA_CI_DISABLE_CONFIG_PUSH is set above.
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader --no-scripts

      - name: Apply fixers in write mode (Rector + PHP CS Fixer)
        # QA_READONLY=0 forces WRITE mode even on GitHub Actions (where php-qa-ci
        # auto-enables read-only). This only formats — the gate verifies read-only.
        run: QA_READONLY=0 vendor/bin/qa -t allCS

      - name: Commit and push any fixes back to the PR branch, then start QA on the new head
        env:
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "Auto-fix: nothing to fix — tree is already clean."
            exit 0
          fi
          echo "Auto-fix: committing the following machine-applied fixes:"
          git status --porcelain
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: apply automated code-style fixes [autofix]"
          gh auth setup-git
          git push origin "HEAD:${HEAD_REF}"
          gh workflow run qa.yml --ref "${HEAD_REF}"
          echo "Auto-fix: pushed, and started QA on the new head commit so its gate check reports."

  # Runs on pull requests, manual runs and pushes to the default branch. autofix is skipped (not failed) on
  # pushes and fork pull requests, so the gate then runs on the commit as it is.
  gate:
    name: QA gate (read-only qa)
    needs: autofix
    if: >-
      ${{ !cancelled() && needs.autofix.result != 'failure'
          && (github.event_name == 'pull_request'
              || github.event_name == 'workflow_dispatch'
              || github.ref_name == github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    steps:
      # A same-repository PR is checked at its branch tip (which autofix may just have moved); a fork PR at
      # the merge ref GitHub provides, because its branch does not exist in this repository.
      - name: Checkout the (possibly auto-fixed) tip
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && github.head_ref || github.ref }}
          # Full history: the changelog lane below measures the change from the merge base with main.
          fetch-depth: 0
          persist-credentials: false

      # Xdebug provides the coverage the phpunit lane reports and Infection mutates against. Without it
      # php-qa-ci skips mutation testing; scripts/check-qa-measurements.bash fails the gate if that happens.
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer:v2
          extensions: mbstring, intl, json, zip, dom, curl, libxml, xml, simplexml, iconv, pdo

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader --no-scripts

      # The whole pipeline in one run: coding standards (read-only), linting, the changelog lane (it switches
      # itself off on main, qaConfig/ChangelogLaneSwitch.php), static analysis, the unit and gap-aware
      # conformance tests with coverage, and Infection. Only an unfiltered run lets Infection reuse the
      # phpunit lane's coverage; any `-t` selection makes it run the whole suite a second time.
      - name: Full QA pipeline
        env:
          CI: 'true'
        run: vendor/bin/qa

      - name: Coverage and mutation lanes ran and meet their floors
        run: scripts/check-qa-measurements.bash

      - name: Upstream shell conformance (jq shtest, yq acceptance)
        run: scripts/conformance-shell.bash all
