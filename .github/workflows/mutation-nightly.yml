# ============================================================================
# Nightly full mutation run
# ============================================================================
# Pull requests, pushes and releases mutate only the source their change could weaken the testing of
# (scripts/mutation-scope.bash). This workflow mutates all of src/ on the default branch every night, and on
# demand: it fails when the Infection floors in qaConfig/qa.php, the coverage floors or the skipped-mutant cap in
# scripts/check-qa-measurements.bash are missed, prints the measured MSI so the floors can be ratcheted up
# (plan 00011), and keeps the Infection logs as an artefact. A full run takes hours; the job stops before
# GitHub's 6-hour limit so a run that cannot finish fails instead of being cancelled silently.
# ============================================================================

name: Mutation (nightly, full)

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: mutation-nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  PHP_QA_CI_DISABLE_CONFIG_PUSH: 'true'

jobs:
  mutation:
    name: Full Infection run on the default branch
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up PHP with Xdebug (Infection's coverage driver)
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer:v2
          extensions: mbstring, intl, json, zip, dom, curl, libxml, xml, simplexml, iconv, pdo

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader --no-scripts

      # A single-lane run generates its own coverage (Xdebug) before mutating, so it needs no phpunit lane.
      - name: Mutate all of src/
        env:
          CI: 'true'
        run: vendor/bin/qa -t infection

      - name: Report the measured MSI and check every floor
        if: ${{ !cancelled() }}
        run: scripts/check-qa-measurements.bash

      - name: Keep the Infection logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: infection-${{ github.run_id }}
          path: var/qa/infection/*.txt
          if-no-files-found: warn
          retention-days: 30
